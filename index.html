<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little World</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px;
      text-align: center;
      letter-spacing: 3px;
      border-bottom: 1px solid #374151;
    }

  /* PC版：左右の文章と中央画像の配置 */


main {
  /* x:20px(右へ),-20px(左へ) y:20px(下へ),-20px(上へ) */
  /* 左側の文章の位置 */
  --left-position-x: 50px;
  --left-position-y: 0px;

  /* 右側の文章の位置 */
  --right-position-x: 0px;
  --right-position-y: 0px;

  /* 文字揃え：left / center / right */
  --left-align: left;
  --right-align: left;

  /* 横幅の設定 */
  --side-width: 280px;
  --stage-width: 440px;

  flex: 0 0 auto;
  display: grid;
  grid-template-columns:
    minmax(0, var(--side-width))
    minmax(0, var(--stage-width))
    minmax(0, var(--side-width));
  justify-content: center;
  align-items: center;
  gap: 24px;
  max-width: 1200px;
  width: 100%;
  margin: auto;
  padding: 24px;
}

/* 左右の文章の基本設定 */
.side {
  min-width: 0;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

/* 左側の文章 */
main > .side:first-child {
  transform: translate(
    var(--left-position-x),
    var(--left-position-y)
  );
  text-align: var(--left-align);
}

/* 右側の文章 */
main > .side:last-child {
  transform: translate(
    var(--right-position-x),
    var(--right-position-y)
  );
  text-align: var(--right-align);
}
  
  
  /* 見出しの装飾 */
  .side h2 {
    color: #93c5fd;
    font-size: 1.1rem;
  }

  /* 本文の装飾 */
  .side p {
    color: #d1d5db;
    font-size: 0.95rem;
  }
  
  /* ハイパーリンクの色 */
.side a {
  color: #93c5fd;
  text-decoration: underline;
}

/* マウスを乗せたとき */
.side a:hover {
  color: #bfdbfe;
}

/* キャラクターと土台をまとめるエリア */
.character-stage {
  position: relative;
  width: 100%;
  height: 440px;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

/* 固定する土台の画像 */
  .platform-image {
    position: absolute;
    z-index: 0;
    width: 100%;
    max-width: none;
    height: auto;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    pointer-events: none;
  }

/* 切り替わるキャラクター */
  #character {
    position: absolute;
    z-index: 1;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    width: auto;
    height: 310px;
    max-width: 80%;
    object-fit: contain;
    cursor: pointer;
    transition: opacity 0.25s, transform 0.35s;
  }

  #character:hover {
    transform: translateX(-50%) scale(1.05);
  }

  #character.change {
    transform: translateX(-50%) scale(0.85);
    opacity: 0;
  }

    #hint {
      text-align: center;
      color: #9ca3af;
      padding: 8px 20px;
      font-size: 0.85rem;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      main {
        grid-template-columns: 1fr 1fr;
      }
      #character {
        grid-column: 1 / -1;
        grid-row: 1;
      }
      .side { padding: 8px; }
    }
    
/* スマホ向けレイアウト */
@media (max-width: 650px) {
  header {
    padding: 6px 16px;
  }
  body {
    min-height: 0;
  }

  /* この下に既存のスマホ用CSSが続く */

  header h1 {
    font-size: 1.5rem;
    line-height: 1.3;
    letter-spacing: 2px;
    margin-top: 0;
    margin-bottom: 8px;
  }

  header p {
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: start;
  gap: 8px 12px;
  width: 100%;
  margin: 0;
  padding: 12px 16px 4px;
  flex: 0 0 auto;
}

.character-stage {
  grid-column: 1 / -1;
  order: -1;
  width: 100%;
  height: 250px;
  overflow: hidden;
}


  .character-stage .platform-image {
    width: 100%;
    max-width: 72%;
    bottom: 0;
  }

  #character {
    height: 190px;
    max-width: 57%;
    bottom: 65px;
  }

  .side {
    width: 100%;
    padding: 0;
    overflow-wrap: anywhere;
    margin-top: 0px;
  }
  
    /* スマホではPC版の位置調整を解除 */
    main > .side:first-child,
    main > .side:last-child {
    transform: none;
    }
  
  .side h2 {
    font-size: 1.15rem;
  }

  .side p {
    font-size: 1rem;
  }

#hint {
  padding: 0 8px;
  font-size: 0.8rem;
  margin: 0 0 8px;
　}
}

  </style>
</head>
<body>
  <header>
    <h1>MY LITTLE WORLD</h1>
    <p>小さな冒険へようこそ</p>
  </header>

  <main>
<section class="side">
  <div id="left-content">
    <h2>ABOUT ME</h2>
    <p>こんにちは！</p>
    <p>このサイトの管理人です。</p>
    <p>好きなことを発信してます。</p>
  </div>
</section>

  <div class="character-stage">
    <img
      src="platform.png"
      class="platform-image"
      alt=""
    >

  <img
    id="character"
    class="stage-character"
    src="このサイトについて.png"
    alt="キャラクター"
  >
</div>

<section class="side">
  <div id="right-content">
    <h2>このサイトについて</h2>
    <p>ここは自分だけの小さな世界。</p>
    <p>スクロールして冒険してみよう。</p>
  </div>
  <p><button id="select-button">詳しく見る →</button></p>
</section>
  </main>

<!-- ABOUT ME テンプレート -->
<template id="template-about">
  <div class="left-content">
    <h2>ABOUT ME</h2>
    <p>こんにちは！</p>
    <p>このサイトの管理人です。</p>
    <p>好きなことを発信してます。</p>
  </div>

  <div class="right-content">
    <h2>このサイトについて</h2>
    <p>ここは自分だけの小さな世界。</p>
    <p>スクロールして冒険しよう。</p>
  </div>
</template>

<!-- BLOG テンプレート -->
<template id="template-blog">
  <div class="left-content">
    <h2>LATEST POSTS</h2>
    <p>01. <a href="articles/first_page.html">Web制作を始めました</a></p>
    <p>02. 便利なツールを考える</p>
    <p>03. 今日の制作メモ</p>
  </div>

  <div class="right-content">
    <h2>BLOG</h2>
    <p>日々の学びや発見を記事にしています。</p>
    <p>気になる記事を選んでみよう。</p>
  </div>
</template>

<!-- TOOLS テンプレート -->
<template id="template-tools">
  <div class="left-content">
    <h2>MY PROJECTS</h2>
    <p>01. <a href="tool/article_editor.html">HTML記事書き出しツール</a></p>
    <p>02. 自分用の便利ツール</p>
    <p>03. 制作中のアイデア</p>
  </div>

  <div class="right-content">
    <h2>TOOLS</h2>
    <p>作ってみたツールを紹介します。</p>
    <p>これから少しずつ増やす予定です。</p>
  </div>
</template>

  <div id="hint">
   <p>マウスホイールでコンテンツを切り替える ↑ ↓</p>
   <p>当サイトは、AIツールを活用しながら制作・運営しています。掲載内容やデザインの確認・調整は、運営者自身が行っています。</p>
  </div>

  <script>
const pages = [
  {
    character: "このサイトについて.png",
    template: "template-about",
    title: "このサイトについて"
  },
  {
    character: "blog.png",
    template: "template-blog",
    title: "BLOG"
  },
  {
    character: "tool.png",
    template: "template-tools",
    title: "TOOLS"
  }
]; 
    let current = 0;
    let lastWheel = 0;

function showPage(index) {
  current = (index + pages.length) % pages.length;
  const page = pages[current];

  const character = document.getElementById("character");
  character.classList.add("change");

  setTimeout(() => {
    // キャラクター画像を変更
    character.src = page.character;

    // テンプレートを取得
    const template = document.getElementById(page.template);

    // 左右のコンテンツを取得
    const leftContent = template.content.querySelector(".left-content");
    const rightContent = template.content.querySelector(".right-content");

    // 画面に反映
    document.getElementById("left-content").innerHTML = leftContent.innerHTML;
    document.getElementById("right-content").innerHTML = rightContent.innerHTML;

    character.classList.remove("change");
  }, 150);
}

    window.addEventListener("wheel", (event) => {
      const now = Date.now();
      if (now - lastWheel < 700) return;
      if (Math.abs(event.deltaY) < 10) return;

      lastWheel = now;
      showPage(current + (event.deltaY > 0 ? 1 : -1));
    }, { passive: true });

function selectPage() {
  const page = pages[current];
  alert(page.title + " のページは、これから作っていこう！");
}

  // スマホの横スワイプでコンテンツを切り替える
  let touchStartX = 0;
  let touchStartY = 0;

  const stage = document.querySelector(".character-stage");

  stage.addEventListener("touchstart", (event) => {
    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;
  }, { passive: true });

  stage.addEventListener("touchend", (event) => {
    const touchEndX = event.changedTouches[0].screenX;
    const touchEndY = event.changedTouches[0].screenY;

    const distanceX = touchStartX - touchEndX;
    const distanceY = touchStartY - touchEndY;

    // 横方向に50px以上動き、縦方向より大きいときだけ反応
    if (Math.abs(distanceX) < 50) return;
    if (Math.abs(distanceX) <= Math.abs(distanceY)) return;

    const now = Date.now();
    if (now - lastWheel < 700) return;

    lastWheel = now;

    // 左スワイプ → 次へ、右スワイプ → 前へ
    showPage(current + (distanceX > 0 ? 1 : -1));
  }, { passive: true });


    document.getElementById("character").addEventListener("click", selectPage);
    document.getElementById("select-button").addEventListener("click", selectPage);
  </script>
</body>
</html>
