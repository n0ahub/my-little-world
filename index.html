<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little World</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px;
      text-align: center;
      letter-spacing: 3px;
      border-bottom: 1px solid #374151;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      gap: 16px;
      max-width: 1100px;
      width: 100%;
      margin: auto;
      padding: 24px;
    }

    .side { line-height: 1.9; }
    .side h2 { color: #93c5fd; font-size: 1.1rem; }
    .side p { color: #d1d5db; font-size: 0.95rem; }

/* キャラクターと土台をまとめるエリア */
.character-stage {
  position: relative;
  width: 100%;
  height: 440px;
  display: flex;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}

/* 固定する土台の画像 */
  .platform-image {
    position: absolute;
    z-index: 0;
    width: 130%;
    max-width: none;
    height: auto;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    pointer-events: none;
  }

/* 切り替わるキャラクター */
  #character {
    position: absolute;
    z-index: 1;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    width: auto;
    height: 310px;
    max-width: 80%;
    object-fit: contain;
    cursor: pointer;
    transition: opacity 0.25s, transform 0.35s;
  }

  #character:hover {
    transform: translateX(-50%) scale(1.05);
  }

  #character.change {
    transform: translateX(-50%) scale(0.85);
    opacity: 0;
  }

    #hint {
      text-align: center;
      color: #9ca3af;
      padding: 20px;
      font-size: 0.85rem;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      main {
        grid-template-columns: 1fr 1fr;
      }
      #character {
        grid-column: 1 / -1;
        grid-row: 1;
      }
      .side { padding: 8px; }
    }
    
/* スマホ向けレイアウト */
@media (max-width: 650px) {
  header {
    padding: 6px 16px;
  }

  header h1 {
    font-size: 1.2rem;
    line-height: 1.3;
    letter-spacing: 2px;
    margin-top: 0;
    margin-bottom: 8px;
  }

  header p {
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: start;
  gap: 20px 12px;
  width: 100%;
  padding: 24px 16px;
}


.character-stage {
  grid-column: 1 / -1;
  order: -1;
  width: 100%;
  height: 250px;
  overflow: hidden;
}


  .character-stage .platform-image {
    width: 100%;
    max-width: 72%;
    bottom: 0;
  }

  #character {
    height: 190px;
    max-width: 57%;
    bottom: 65px;
  }

  .side {
    width: 100%;
    padding: 0;
    overflow-wrap: anywhere;
  }

  .side h2 {
    font-size: 1.15rem;
  }

  .side p {
    font-size: 1rem;
  }

  #hint {
    padding: 0px 8px;
    font-size: 0.8rem;
  }
}

  </style>
</head>
<body>
  <header>
    <h1>MY LITTLE WORLD</h1>
    <p>小さな冒険へようこそ</p>
  </header>

  <main>
    <section class="side">
      <h2 id="left-title">ABOUT ME</h2>
      <div id="left-content">
        <p>こんにちは！</p>
        <p>このサイトの管理人です。</p>
        <p>好きなことを少しずつ発信します。</p>
      </div>
    </section>


  <div class="character-stage">
    <img
      src="platform.png"
      class="platform-image"
      alt=""
    >

  <img
    id="character"
    class="stage-character"
    src="このサイトについて.png"
    alt="キャラクター"
  >
</div>

  <div id="character" title="クリックして詳しく見る"></div>

</div>

    <section class="side">
      <h2 id="right-title">このサイトについて</h2>
      <div id="right-content">
        <p>ここは自分だけの小さな世界。</p>
        <p>スクロールして冒険してみよう。</p>
      </div>
      <p><button id="select-button">詳しく見る →</button></p>
    </section>
  </main>

  <div id="hint">マウスホイールでコンテンツを切り替える ↑ ↓</div>

  <script>
    const pages = [
  {
    character: "このサイトについて.png",
    leftTitle: "ABOUT ME",
    left: "<p>こんにちは！</p><p>このサイトの管理人です。</p><p>好きなことを発信してます。</p>",
    rightTitle: "このサイトについて",
    right: "<p>ここは自分だけの小さな世界。</p><p>スクロールして冒険しよう。</p>"
  },
  {
    character: "blog.png",
    leftTitle: "LATEST POSTS",
    left: "<p>01. Web制作を始めた</p><p>02. 便利なツールを考える</p><p>03. 今日の制作メモ</p>",
    rightTitle: "BLOG",
    right: "<p>日々の学びや発見を記事にしています。</p><p>気になる記事を選んでみよう。</p>"
  },
  {
    character: "tool.png",
    leftTitle: "MY PROJECTS",
    left: "<p>01. 小さな計算ツール</p><p>02. 自分用の便利ツール</p><p>03. 制作中のアイデア</p>",
    rightTitle: "TOOLS",
    right: "<p>作ってみたツールを紹介します。</p><p>これから少しずつ増やす予定です。</p>"
  }
];
    let current = 0;
    let lastWheel = 0;

    function showPage(index) {
      current = (index + pages.length) % pages.length;
      const page = pages[current];

      const character = document.getElementById("character");
      character.classList.add("change");

      setTimeout(() => {
        character.src = page.character;
        document.getElementById("left-title").textContent = page.leftTitle;
        document.getElementById("left-content").innerHTML = page.left;
        document.getElementById("right-title").textContent = page.rightTitle;
        document.getElementById("right-content").innerHTML = page.right;
        character.classList.remove("change");
      }, 150);
    }

    window.addEventListener("wheel", (event) => {
      const now = Date.now();
      if (now - lastWheel < 700) return;
      if (Math.abs(event.deltaY) < 10) return;

      lastWheel = now;
      showPage(current + (event.deltaY > 0 ? 1 : -1));
    }, { passive: true });

    function selectPage() {
      const page = pages[current];
      alert(page.rightTitle + " のページは、これから作っていこう！");
    }

  // スマホの横スワイプでコンテンツを切り替える
  let touchStartX = 0;
  let touchStartY = 0;

  const stage = document.querySelector(".character-stage");

  stage.addEventListener("touchstart", (event) => {
    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;
  }, { passive: true });

  stage.addEventListener("touchend", (event) => {
    const touchEndX = event.changedTouches[0].screenX;
    const touchEndY = event.changedTouches[0].screenY;

    const distanceX = touchStartX - touchEndX;
    const distanceY = touchStartY - touchEndY;

    // 横方向に50px以上動き、縦方向より大きいときだけ反応
    if (Math.abs(distanceX) < 50) return;
    if (Math.abs(distanceX) <= Math.abs(distanceY)) return;

    const now = Date.now();
    if (now - lastWheel < 700) return;

    lastWheel = now;

    // 左スワイプ → 次へ、右スワイプ → 前へ
    showPage(current + (distanceX > 0 ? 1 : -1));
  }, { passive: true });


    document.getElementById("character").addEventListener("click", selectPage);
    document.getElementById("select-button").addEventListener("click", selectPage);
  </script>
</body>
</html>
