<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>記事づくりエディタ</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2638;--line:#34445d;--text:#e7edf7;--muted:#aab8cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
header{padding:22px 24px;border-bottom:1px solid var(--line)}header h1{margin:0 0 6px;font-size:1.35rem}header p,.note{color:var(--muted);font-size:.85rem;line-height:1.6}
main{max-width:1180px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}h2{font-size:1rem;margin:0 0 12px}
label{display:block;color:var(--muted);font-size:.85rem;margin:12px 0 5px}
input[type=text]{width:100%;padding:10px;border-radius:7px;border:1px solid var(--line);background:#111c2d;color:var(--text);font:inherit}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
button,select,.tool{border:1px solid var(--line);background:#26364d;color:var(--text);border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit;font-size:.88rem}
button:hover{background:#344b69}input[type=color]{vertical-align:middle}
#editor{min-height:430px;padding:16px;background:#f8fafc;color:#202938;border-radius:8px;outline:none;line-height:1.9}
#editor:empty:before{content:"ここをクリックして記事を書き始めます…";color:#8793a3}#editor img,#preview img{max-width:100%;height:auto}
#preview{background:#0c1422;border-radius:8px;padding:24px;min-height:520px;line-height:1.9;overflow-wrap:anywhere}
#preview h1,#preview h2,#preview h3{line-height:1.4;color:#f1f5f9}#preview a{color:#93c5fd}
#preview .article-title{font-size:1.8rem;margin:0 0 20px;padding-bottom:14px;border-bottom:1px solid #34445d}
.primary{background:#2563eb;border-color:#2563eb}
@media(max-width:800px){main{grid-template-columns:1fr}.panel{padding:12px}#editor{min-height:350px}}
</style></head>
<body>
<header><h1>記事づくりエディタ</h1><p>PC内で記事を作成し、完成したらHTMLファイルとして書き出せます。</p></header>
<main>
<section class="panel">
<h2>① 記事を書く</h2>
<label for="articleTitle">記事タイトル</label><input id="articleTitle" type="text" placeholder="例：最近遊んだゲームの話">
<div class="toolbar">
<button data-cmd="bold"><b>太字</b></button><button data-cmd="italic"><i>斜体</i></button><button data-cmd="underline"><u>下線</u></button>
<button data-block="h2">見出し</button><button data-block="h3">小見出し</button><button data-block="p">本文</button>
<button data-cmd="justifyLeft">左寄せ</button><button data-cmd="justifyCenter">中央</button><button data-cmd="justifyRight">右寄せ</button>
<select id="fontSize" aria-label="文字サイズ"><option value="3">標準</option><option value="2">小さめ</option><option value="4">大きめ</option><option value="5">大</option><option value="6">特大</option></select>
<label class="tool">文字色 <input id="textColor" type="color" value="#202938"></label>
<button id="addLink">リンク</button><button id="addImage">画像URL</button>
</div>
<div id="editor" contenteditable="true" spellcheck="true"></div>
<div class="actions"><button id="refreshPreview">プレビュー更新</button><button class="primary" id="exportHtml">HTMLを書き出す</button><button id="clearAll">内容を消去</button></div>
<p class="note">画像はURLまたは相対パスで挿入します。画像ファイルもGitHubにアップロードし、記事からの相対パスを指定してください。</p>
</section>
<section class="panel"><h2>② 公開前のプレビュー</h2><article id="preview"><p class="note">タイトルと本文を入力して「プレビュー更新」を押してください。</p></article><p class="note">書き出したHTMLをGitHub Pagesにアップロードすると公開できます。</p></section>
</main>
<script>
const editor=document.getElementById('editor'),titleInput=document.getElementById('articleTitle'),preview=document.getElementById('preview');
function focusEditor(){editor.focus()}
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{focusEditor();document.execCommand(b.dataset.cmd,false,null)}));
document.querySelectorAll('[data-block]').forEach(b=>b.addEventListener('click',()=>{focusEditor();document.execCommand('formatBlock',false,b.dataset.block)}));
document.getElementById('fontSize').addEventListener('change',e=>{focusEditor();document.execCommand('fontSize',false,e.target.value)});
document.getElementById('textColor').addEventListener('input',e=>{focusEditor();document.execCommand('foreColor',false,e.target.value)});
document.getElementById('addLink').addEventListener('click',()=>{const u=prompt('リンク先URL');if(u){focusEditor();document.execCommand('createLink',false,u)}});
document.getElementById('addImage').addEventListener('click',()=>{const u=prompt('画像URLまたは相対パス');if(u){focusEditor();document.execCommand('insertImage',false,u)}});
function updatePreview(){preview.innerHTML='<h1 class="article-title"></h1>'+editor.innerHTML;preview.querySelector('h1').textContent=titleInput.value.trim()||'タイトル未入力'}
document.getElementById('refreshPreview').addEventListener('click',updatePreview);
document.getElementById('clearAll').addEventListener('click',()=>{if(confirm('タイトルと本文を消去しますか？')){titleInput.value='';editor.innerHTML='';updatePreview()}});
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('exportHtml').addEventListener('click',()=>{
 updatePreview();const title=esc(titleInput.value.trim()||'記事');
 const output=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${title}</title>
<style>body{margin:0;padding:32px 18px;background:#101827;color:#e7edf7;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.9}main{max-width:820px;margin:0 auto}h1{font-size:2rem;line-height:1.4;padding-bottom:16px;border-bottom:1px solid #34445d}h2,h3{line-height:1.5;color:#f1f5f9;margin-top:2em}p{margin:1em 0}a{color:#93c5fd}img{max-width:100%;height:auto;border-radius:8px}.back{display:inline-block;margin-top:32px;color:#93c5fd}</style></head><body><main><h1>${title}</h1>${editor.innerHTML}<a class="back" href="../index.html">← トップページへ戻る</a></main></body></html>`;
 const blob=new Blob([output],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='article.html';a.click();URL.revokeObjectURL(url);
});
updatePreview();
</script></body></html>
